name: agent evaluation

# Runs the 30-question evaluation of "Ask the Credit Desk" against a real model.
# Needs a repository secret named GEMINI_API_KEY (Settings > Secrets and variables > Actions).
on:
  push:
    branches: ["eval/**"]        # pushing an eval/... branch also starts a run
  workflow_dispatch:
    inputs:
      model:
        description: Gemini model name
        required: false
        default: gemini-3.5-flash-lite

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
      - name: List the Flash models this key can use
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" \
            | python -c "import json,sys; print('\n'.join(m['name'] for m in json.load(sys.stdin).get('models', []) if 'flash' in m['name']))" || true
      - name: Run the evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "Add a GEMINI_API_KEY repository secret first."; exit 1; fi
          LIMIT=0
          case "$GITHUB_REF_NAME" in eval/smoke*) LIMIT=3 ;; esac   # eval/smoke-... branches: 3 questions only
          python -u -m credit_risk.agent_eval --model "${{ inputs.model || 'gemini-3.5-flash-lite' }}" --sleep 12 --limit "$LIMIT"
          cat reports/agent_evaluation.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation
          path: |
            reports/agent_evaluation.md
            reports/results/agent_eval.csv
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/agent_evaluation.md reports/results/agent_eval.csv
          git commit -m "Agent evaluation results (${{ inputs.model || 'gemini-3.5-flash-lite' }})" || echo "Nothing new to commit."
          git push
