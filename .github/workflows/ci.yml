name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .
      - name: Run tests (synthetic data only)
        run: pytest
      - name: Smoke-test the full pipeline on synthetic data
        run: python -m credit_risk.pipeline --synthetic
