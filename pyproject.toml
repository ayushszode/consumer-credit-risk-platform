[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "1.0.0"
description = "Consumer credit risk platform: scorecard, challenger model, lending policy analysis and monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayush Sanjay Zode" }]

[project.optional-dependencies]
# pip install -e ".[extras]" --extra-index-url https://download.pytorch.org/whl/cpu
extras = ["xgboost>=2.0", "torch>=2.2", "pyspark>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
